<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Кирилл Чигирин, юрист</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#16130E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{--text:#F6E8D6;--muted:#C9B79D;--gold:#E8892F;--gold-soft:#F1B978;--line:rgba(241,185,120,.16)}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;color:var(--text);padding:32px;
  font:16px/1.7 "Inter",Arial,sans-serif;text-align:center;
  background:radial-gradient(circle at top left, rgba(232,137,47,.08), transparent 30%),
             radial-gradient(circle at 85% 5%, rgba(159,46,16,.20), transparent 25%),
             linear-gradient(180deg,#1A1510 0%,#16130E 45%,#18110c 100%);
}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
h1,h2,p{text-wrap:balance}
.box{max-width:560px;padding:40px 32px;border-radius:26px;background:rgba(255,255,255,.035);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.28)}
.code{font:600 64px/1 "Cormorant Garamond",Georgia,serif;color:var(--gold-soft);margin:0 0 10px;letter-spacing:-.02em}
h1{font:600 30px/1.25 "Cormorant Garamond",Georgia,serif;margin:0 0 14px}
p{color:var(--muted);margin:0 0 26px;text-wrap:pretty}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:12px 24px;border-radius:999px;
  background:linear-gradient(135deg,#9F2E10,#E8892F);color:#170f0b;font-weight:600}
.btn:hover{filter:brightness(1.06)}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>Страница не найдена</h1>
    <p>Возможно, адрес изменился или содержит опечатку. Вернитесь на главную страницу — там все разделы.</p>
    <a class="btn" href="index.html">На главную</a>
  </div>
</body>
</html>
